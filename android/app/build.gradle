def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
def flutterRoot = flutterSdkPath != null ? file(flutterSdkPath) : null

if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define local.properties with flutter.sdk=...")
}

apply from: "$flutterRoot/packages/flutter_tools/gradle/app.gradle"

android {
    compileSdkVersion 34

    namespace "com.louaysadok.rapportplus"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.louaysadok.rapportplus"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
