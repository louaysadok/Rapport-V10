name: rapport_plus
description: "Rapport+ — Journal de stage, rapport de stage et préparation à la soutenance. 100 % hors-ligne, Android uniquement, gratuit."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.5"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Internationalisation (pinned by flutter_localizations for Flutter 3.24)
  intl: ^0.19.0

  # Base de données locale hors-ligne (Drift / SQLite)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.16

  # État et navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0

  # Stockage local, fichiers, préférences
  shared_preferences: ^2.3.3
  path_provider: ^2.2.2
  path: ^1.9.0
  uuid: ^4.4.0
  collection: ^1.18.0

  # Notifications locales (rappel journal 18:00 heure locale)
  flutter_local_notifications: ^17.1.2
  flutter_timezone: ^3.1.1
  timezone: ^1.4.0

  # Médias (photo, vidéo, audio)
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  record: ^5.0.0
  just_audio: ^0.9.35
  permission_handler: ^12.0.1

  # Export rapports
  pdf: ^4.1.1
  printing: ^5.12.1

  # Google Drive (sauvegarde optionnelle, jamais forcée)
  googleapis: ^1.3.2
  googleapis_auth: ^1.6.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.14.1
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
