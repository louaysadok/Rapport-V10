name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable

      - name: Setup Android SDK
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sL --retry 3 --fail https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Write Flutter SDK local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "flutter pub get attempt $i"
            flutter pub get && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Build debug APK
        run: |
          flutter build apk --debug
          echo "=== FLUTTER EXIT CODE: $? ==="

      - name: Find all APK/AAB files (always)
        if: always()
        run: |
          echo "=== All files under workspace ==="
          find . -type f 2>/dev/null | head -300 || echo "No files"
          echo "=== APK files anywhere ==="
          find / -name "*.apk" -type f 2>/dev/null | head -20 || echo "No APK files"
          echo "=== AAB files anywhere ==="
          find / -name "*.aab" -type f 2>/dev/null | head -10 || echo "No AAB files"
          echo "=== All files modified recently ==="
          find /home -type f -newermt "10 minutes ago" 2>/dev/null | head -50 || echo "No recent files in /home"
